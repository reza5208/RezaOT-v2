name: App regression QA
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/*.test.js
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python tests/hr_share_browser.py
      - run: python tests/owner_access_browser.py
      - run: python tests/improvements_browser.py
      - run: python tests/redesign_browser.py
      - run: python tests/recovery_browser.py
      - run: python tests/pdf_report_browser.py
