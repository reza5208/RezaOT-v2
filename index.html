<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RezaOT - Rekod OT & Kehadiran</title>
    
    <!-- ===== PWA CONFIG ===== -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#007bff">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-icon-180.png">
    
    <link rel="stylesheet" href="styles.css">
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
</head>
<body>
    <div class="container">
        <h1>📋 RezaOT v2</h1>
        <p>Rekod Kehadiran & Overtime</p>
        
        <!-- Month Selector -->
        <div class="month-selector">
            <label>Bulan:</label>
            <input type="month" id="monthYear">
            <h2 id="currentMonth">Januari 2026</h2>
        </div>

        <!-- Clock Form -->
        <form id="clockForm">
            <input type="date" id="date">
            <input type="time" id="clockIn" placeholder="Clock In">
            <input type="time" id="clockOut" placeholder="Clock Out">
            <button type="submit">Simpan Kehadiran</button>
        </form>

        <!-- Trip Form -->
        <form id="tripForm">
            <select id="destination">
                <!-- populated by JS -->
            </select>
            <div id="airwayBillField" style="display: none;">
                <input type="text" id="airwayBill" placeholder="Airway Bill">
            </div>
            <button type="submit">Tambah Trip</button>
        </form>

        <!-- Manage Destinations -->
        <button id="toggleManageBtn">Manage Destinasi ▼</button>
        <div id="manageDestinations" style="display: none;">
            <input type="text" id="newTrip" placeholder="Nama destinasi baru">
            <button id="addTripButton">Tambah Destinasi</button>
            <ul id="tripList"></ul>
        </div>

        <!-- Report Table -->
        <h2>Laporan Bulan Ini</h2>
        <table id="reportTable">
            <thead>
                <tr>
                    <th>Tarikh</th>
                    <th>Destinasi</th>
                    <th>Clock In</th>
                    <th>Clock Out</th>
                    <th>OT (Jam)</th>
                    <th class="print-only">Tandatangan Anda</th>
                    <th class="print-only">Tandatangan Penyelia</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        
        <p id="noRecordsMessage" style="text-align:center; color:#888; display:none;">
            Tiada rekod untuk bulan ini.
        </p>

        <div class="total">
            <strong>Jumlah OT: <span id="totalOT">0.00</span> jam</strong>
        </div>

        <!-- Buttons -->
        <div class="actions">
            <button id="printButton">🖨 Cetak Laporan</button>
            <button id="exportDataBtn">📤 Export Backup</button>
            <label>📥 Import Backup <input type="file" id="importDataInput" accept=".json"></label>
        </div>
    </div>

    <!-- Scripts -->
    <script src="constants.js"></script>
    <script src="utils.js"></script>
    <script src="main.js"></script>

    <!-- Service Worker -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('✅ Service Worker Registered'))
                .catch(err => console.error('❌ Service Worker Error:', err));
        }
    </script>
</body>
</html>
