<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="RezaOT">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a8cff"/>
      <stop offset="100%" stop-color="#0070e0"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#003d80" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- App rounded square -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bg)"/>
  <!-- Truck body (cargo) -->
  <g filter="url(#soft)" fill="#ffffff">
    <rect x="95" y="195" width="210" height="145" rx="18"/>
    <!-- Cab -->
    <path d="M310 235 h85 a28 28 0 0 1 28 28 v77 h-113 z"/>
    <!-- Cab window -->
    <rect x="330" y="250" width="58" height="42" rx="8" fill="#1a8cff" opacity="0.35"/>
    <!-- Chassis -->
    <rect x="95" y="340" width="328" height="22" rx="6"/>
    <!-- Wheels -->
    <circle cx="160" cy="375" r="32" fill="#ffffff"/>
    <circle cx="160" cy="375" r="14" fill="#1a8cff" opacity="0.35"/>
    <circle cx="360" cy="375" r="32" fill="#ffffff"/>
    <circle cx="360" cy="375" r="14" fill="#1a8cff" opacity="0.35"/>
  </g>
  <!-- Clock / stopwatch over cargo -->
  <g filter="url(#soft)">
    <!-- Outer white circle -->
    <circle cx="200" cy="210" r="105" fill="#ffffff"/>
    <!-- Teal progress arc (bottom-right, OT feel) -->
    <path d="M200 105 A105 105 0 0 1 295 255" fill="none" stroke="#2dd4bf" stroke-width="22" stroke-linecap="round"/>
    <!-- Inner face ring -->
    <circle cx="200" cy="210" r="82" fill="none" stroke="#e8f4ff" stroke-width="4"/>
    <!-- Hands -->
    <line x1="200" y1="210" x2="200" y2="145" stroke="#1a8cff" stroke-width="10" stroke-linecap="round"/>
    <line x1="200" y1="210" x2="245" y2="250" stroke="#1a8cff" stroke-width="8" stroke-linecap="round"/>
    <circle cx="200" cy="210" r="12" fill="#1a8cff"/>
    <!-- Stopwatch top button -->
    <rect x="188" y="88" width="24" height="22" rx="6" fill="#ffffff"/>
    <circle cx="200" cy="88" r="10" fill="#ffffff"/>
    <!-- Side button -->
    <rect x="88" y="200" width="18" height="24" rx="6" fill="#ffffff"/>
  </g>
  <!-- RezaOT text -->
  <text x="256" y="455" text-anchor="middle" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="1">RezaOT</text>
</svg>
